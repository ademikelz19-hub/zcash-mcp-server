[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zcash-mcp-server"
version = "0.1.0"
description = "Zcash MCP Standard Library — Local-Only Model Context Protocol Server for ZIP 316 Unified Addresses/UFVKs, ZIP 321 Payment Request URIs, Shielded Trial Decryption, and lightwalletd/zebrad RPC (ZECATHON Infrastructure & Accounting Track)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "ZECATHON Builder // NODE 07" }
]
keywords = [
    "zcash",
    "zk-snarks",
    "mcp",
    "fastmcp",
    "zip-316",
    "zip-321",
    "zip-317",
    "lightwalletd",
    "zebrad",
    "antigravity",
    "privacy"
]
dependencies = [
    "fastmcp>=2.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "segno>=1.6.0",
]

[project.optional-dependencies]
antigravity = [
    "google-antigravity>=0.1.0",
]
grpc = [
    "grpcio>=1.62.0",
    "protobuf>=4.25.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
zcash-mcp-server = "server:main"
zcash-mcp-cli = "cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.uv]
managed = true
default-groups = ["dev"]
